<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Станешь моей Валентинкой?</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            width:100%;
            height:100vh;

            overflow:hidden;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:'Playpen Sans', cursive;

            background:linear-gradient(135deg,#ffd6df 0%,#f3a8b8 100%);

            user-select:none;
            -webkit-user-select:none;

            touch-action:manipulation;

            position:relative;
        }

        .container{

            width:100%;
            max-width:450px;

            text-align:center;

            padding:20px;

            animation:fadeIn 1s ease;

            z-index:2;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px) scale(.9);
            }

            to{
                opacity:1;
                transform:translateY(0) scale(1);
            }
        }

        h1{

            color:#d81b60;

            margin-bottom:25px;

            font-size:2.2rem;

            text-shadow:2px 2px 5px rgba(0,0,0,.1);
        }

        .image-container{

            margin-bottom:35px;
        }

        .image-container img{

            width:260px;
            max-width:80vw;

            border-radius:20px;

            box-shadow:0 8px 20px rgba(0,0,0,.15);

            transition:.4s;
        }

        .button-group{

            position:relative;

            width:100%;
            height:180px;
        }

        button{

            border:none;

            border-radius:999px;

            cursor:pointer;

            font-family:inherit;

            transition:
                transform .2s ease,
                padding .25s ease,
                font-size .25s ease,
                left .2s ease,
                top .2s ease;

            box-shadow:0 8px 18px rgba(0,0,0,.15);

            color:white;

            position:absolute;
        }

        button:active{

            transform:scale(.92);
        }

        #yes{

            background:#4caf50;

            font-size:1.5rem;

            padding:18px 40px;

            left:35%;
            top:50%;

            transform:translate(-50%,-50%);

            z-index:2;
        }

        #no{

            background:#ff3b30;

            font-size:1.5rem;

            padding:18px 40px;

            left:70%;
            top:50%;

            transform:translate(-50%,-50%);

            z-index:9999;

            white-space:nowrap;
        }

        .final-state #no{

            display:none;
        }

        .final-state #yes{

            left:50%;

            font-size:3rem;

            padding:35px 70px;
        }

        .final-state img{

            width:320px;
        }

        .love-message{

            margin-top:25px;

            color:#d81b60;

            font-size:1.5rem;

            animation:fadeIn 1s ease;
        }

        @media(max-width:480px){

            h1{

                font-size:1.8rem;
            }

            .image-container img{

                width:220px;
            }

            #yes,
            #no{

                font-size:1.05rem;

                padding:14px 24px;
            }

            .final-state #yes{

                font-size:2.2rem;

                padding:24px 45px;
            }

            .final-state img{

                width:260px;
            }
        }

    </style>
</head>

<body>

<div class="container" id="mainContainer">

    <h1 id="headline">
        Станешь моей Валентинкой?
    </h1>

    <div class="image-container">

        <img
            id="valentineImage"
            src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExMThsYmQ2aXA4dHFvNzhtcW83bHBkbWE4bHExa3Jzem50Mng4bGVxbCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/zZbf6UpZslp3nvFjIR/giphy.gif"
            alt="cute gif"
        />

    </div>

    <div class="button-group">

        <button id="yes">
            Да 💖
        </button>

        <button id="no">
            Нет
        </button>

    </div>

</div>

<script>

    const yesButton =
        document.getElementById('yes');

    const noButton =
        document.getElementById('no');

    const image =
        document.getElementById('valentineImage');

    const headline =
        document.getElementById('headline');

    const container =
        document.getElementById('mainContainer');

    let noCount = 0;

    let escapeMode = false;

    const noTexts = [

        "Ты уверена? 🥺",
        "Точно нет? 💔",
        "Мне будет грустно 😢",
        "Последний шанс ❤️"
    ];

    const sadImages = [

        "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExZDJzM2xyMm1qc3h6OWZsa3VrYzk1a3VjemI5a280Nzh6bnd2dW5vciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/JEVqknUonZJWU/giphy.gif",

        "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExaDV3MmhjMTU5ZXIxeDd1aWt0dmxhb2ZmNzNlNHRlaTlvZW53Y2d5NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/6igzSbAknkfRffcOKi/giphy.gif",

        "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExcmdhdjdtbmNyOWZzZmpzbWFmN2Q2eTJkMHZkZm1oOWpkZGc2cHZvaSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/NTY1kHmcLsCsg/giphy.gif",

        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbTRpcG5tdnl2eTBpbWx5aGl6MTd6ZHZ4cXFuYTBpM3VtNndiMDN3diZlcD12MV9naWZzX3NlYXJjaCZjdD1n/L5WQjD4p8IpO0/giphy.gif"
    ];

    function moveNoButton(){

        if(!escapeMode) return;

        const maxX =
            window.innerWidth - noButton.offsetWidth;

        const maxY =
            window.innerHeight - noButton.offsetHeight;

        let randomX;
        let randomY;

        let safe = false;

        while(!safe){

            randomX =
                Math.random() * maxX;

            randomY =
                Math.random() * maxY;

            const yesRect =
                yesButton.getBoundingClientRect();

            const distanceX =
                Math.abs(randomX - yesRect.left);

            const distanceY =
                Math.abs(randomY - yesRect.top);

            if(
                distanceX > 180 ||
                distanceY > 120
            ){
                safe = true;
            }
        }

        noButton.style.position = 'fixed';

        noButton.style.left =
            `${randomX}px`;

        noButton.style.top =
            `${randomY}px`;

        noButton.style.transform =
            'none';
    }

    function handleNo(){

        noCount++;

        if(noCount <= 4){

            noButton.innerText =
                noTexts[noCount - 1];

            image.src =
                sadImages[noCount - 1];
        }

        const newSize =
            Math.min(
                2.6,
                1.5 + noCount * .18
            );

        const newPadding =
            Math.min(
                50,
                18 + noCount * 5
            );

        yesButton.style.fontSize =
            `${newSize}rem`;

        yesButton.style.padding =
            `${newPadding}px ${newPadding * 1.7}px`;

        /* UCIEKANIE DOPIERO PRZY OSTATNIM */

        if(noCount >= 4){

            escapeMode = true;

            moveNoButton();
        }
    }

    function createConfetti(){

        for(let i = 0; i < 120; i++){

            const confetti =
                document.createElement('div');

            confetti.style.position =
                'fixed';

            confetti.style.width =
                '10px';

            confetti.style.height =
                '10px';

            confetti.style.background =
                `hsl(${Math.random()*360},100%,70%)`;

            confetti.style.left =
                Math.random()*100 + 'vw';

            confetti.style.top =
                '-20px';

            confetti.style.borderRadius =
                '50%';

            confetti.style.zIndex =
                '9999';

            confetti.style.pointerEvents =
                'none';

            document.body.appendChild(confetti);

            const animation =
                confetti.animate(

                    [

                        {
                            transform:
                                `translateY(0px) rotate(0deg)`,

                            opacity:1
                        },

                        {
                            transform:
                                `translateY(110vh)
                                translateX(${Math.random()*200-100}px)
                                rotate(${Math.random()*720}deg)`,

                            opacity:0
                        }

                    ],

                    {

                        duration:
                            2000 + Math.random()*2000,

                        easing:'ease-out'
                    }
                );

            animation.onfinish = () => {

                confetti.remove();
            };
        }
    }

    function handleYes(){

        createConfetti();

        container.classList.add(
            'final-state'
        );

        headline.innerText =
            "Я знал, что ты согласишься! 🎉";

        image.src =
            "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdzExb2RpNXo2d3p0eHlpa3p3cTVhYmF0eGdqYXhnNG50NjdvaWNkdCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/IzXiddo2twMmdmU8Lv/giphy.gif";

        const msg =
            document.createElement('div');

        msg.className =
            'love-message';

        msg.innerText =
            "Ты сделала меня самым счастливым человеком 💖";

        container.appendChild(msg);
    }

    yesButton.addEventListener(
        'click',
        handleYes
    );

    noButton.addEventListener(
        'click',
        handleNo
    );

    noButton.addEventListener(
        'mouseover',
        () => {

            if(escapeMode){

                moveNoButton();
            }
        }
    );

    noButton.addEventListener(
        'touchstart',
        (e) => {

            if(escapeMode){

                e.preventDefault();

                moveNoButton();
            }
        }
    );

</script>

</body>
</html>
