<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Для Violetto 💜</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(180deg,#12001f,#2b0040,#4b006e);
      font-family:Arial, sans-serif;
      position:relative;
    }

    .message{
      position:relative;
      z-index:10;
      text-align:center;
      color:white;
      padding:20px;
      animation: glow 2s infinite alternate;
    }

    .message h1{
      font-size: clamp(32px, 7vw, 70px);
      text-shadow:0 0 10px #ff66cc,
                  0 0 20px #ff66cc,
                  0 0 40px #ff66cc;
    }

    .hearts{
      margin-top:20px;
      font-size: clamp(30px,5vw,50px);
      animation: pulse 1.5s infinite;
    }

    @keyframes glow{
      from{
        transform:scale(1);
      }
      to{
        transform:scale(1.03);
      }
    }

    @keyframes pulse{
      0%{transform:scale(1);}
      50%{transform:scale(1.2);}
      100%{transform:scale(1);}
    }

    .rain{
      position:absolute;
      top:-10vh;
      color:#ffb3ec;
      font-size:20px;
      animation: fall linear infinite;
      opacity:0.8;
    }

    @keyframes fall{
      to{
        transform:translateY(120vh);
      }
    }
  </style>
</head>
<body>

  <div class="message">
    <h1>Я люблю тебя,<br>моя самая сладкая Violetto 💜</h1>
    
    <div class="hearts">
      ❤️ ❤️ ❤️
    </div>
  </div>

  <script>
    function createHeart(){
      const heart = document.createElement("div");
      heart.classList.add("rain");
      heart.innerHTML = "💖 ";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random() * 5) + "s";
      heart.style.fontSize = (15 + Math.random() * 35) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 8000);
    }

    setInterval(createHeart, 200);
  </script>

</body>
</html>
